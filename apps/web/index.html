<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Jumper</title>
    <meta name="description" content="Jumper: git hosting, visual review and automated checks for KiCad hardware." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jumper" />
    <meta property="og:title" content="Jumper: see what changed on the board" />
    <meta property="og:description" content="Git hosting for KiCad. Every commit is rendered, checked and compared as a board." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jumper: see what changed on the board" />
    <meta name="twitter:description" content="Git hosting for KiCad. Every commit is rendered, checked and compared as a board." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="theme-color" content="#101112" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f1f2ef" media="(prefers-color-scheme: light)" />
    <script>
      // Apply the theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('jumper-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
