# PCBHub self-hosted stack.
#   cp .env.example .env   # then edit secrets
#   docker compose -f docker/docker-compose.yml up -d --build
name: pcbhub

x-env: &env
  NODE_ENV: production
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  DATABASE_URL: postgres://pcbhub:${POSTGRES_PASSWORD:-pcbhub}@postgres:5432/pcbhub
  REDIS_URL: redis://redis:6379
  REPOS_DIR: /data/repos
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: pcbhub
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-pcbhub}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-pcbhub-secret}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pcbhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcbhub}
      POSTGRES_DB: pcbhub
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pcbhub']
      interval: 5s
      retries: 10
    ports: ['127.0.0.1:5432:5432']

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
    ports: ['127.0.0.1:6379:6379']

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pcbhub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pcbhub-secret}
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']

  api:
    build: { context: .., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    environment:
      <<: *env
      API_PORT: 3000
      TRUST_PROXY: 'true'
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes: [repos:/data/repos]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker:
    build: { context: .., dockerfile: docker/worker.Dockerfile }
    restart: unless-stopped
    environment:
      <<: *env
      # The worker image *is* the hardened KiCad sandbox: no host docker socket needed.
      WORKER_SANDBOX: none
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes: [repos:/data/repos:ro]
    read_only: true
    tmpfs: ['/tmp:size=4g', '/home/kicad:size=512m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 1024
    mem_limit: 8g
    cpus: 4
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  web:
    build: { context: .., dockerfile: docker/web.Dockerfile }
    restart: unless-stopped
    ports: ['${HTTP_PORT:-8080}:80']
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  miniodata:
  repos:
