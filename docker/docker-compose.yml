# Jumper self-hosted stack.
#   cp .env.example .env   # then edit secrets
#   docker compose -f docker/docker-compose.yml up -d --build
name: pcbhub

x-env: &env
  NODE_ENV: production
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  DATABASE_URL: postgres://pcbhub:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/pcbhub
  REDIS_URL: redis://redis:6379
  REPOS_DIR: /data/repos
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: pcbhub
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pcbhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pcbhub
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pcbhub']
      interval: 5s
      retries: 10
    ports: ['127.0.0.1:5432:5432']

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
    ports: ['127.0.0.1:6379:6379']

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']

  api:
    build: { context: .., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    environment:
      <<: *env
      API_PORT: 3000
      TRUST_PROXY: 'true'
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      PRICING_ENABLED: ${PRICING_ENABLED:-true}
      MOUSER_API_KEY: ${MOUSER_API_KEY:-}
      DIGIKEY_CLIENT_ID: ${DIGIKEY_CLIENT_ID:-}
      DIGIKEY_CLIENT_SECRET: ${DIGIKEY_CLIENT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-false}
      # Encrypts stored mirror tokens. Set it, or a random key is kept on the repos volume.
      SECRET_KEY: ${SECRET_KEY:-}
      SECRET_KEY_FILE: /data/repos/.secret.key
      # git over SSH: ssh://git@your-host:${SSH_PUBLIC_PORT:-2222}/owner/repo.git
      SSH_ENABLED: ${SSH_ENABLED:-true}
      SSH_PORT: 2222
      SSH_PUBLIC_PORT: ${SSH_PUBLIC_PORT:-2222}
      SSH_PUBLIC_HOST: ${SSH_PUBLIC_HOST:-}
      SSH_HOST_KEY_FILE: /data/repos/.ssh_host_ed25519_key
    ports: ['${SSH_PUBLIC_PORT:-2222}:2222']
    volumes: [repos:/data/repos]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker:
    build: { context: .., dockerfile: docker/worker.Dockerfile }
    restart: unless-stopped
    environment:
      <<: *env
      # The worker image *is* the hardened KiCad sandbox: no host docker socket needed.
      WORKER_SANDBOX: none
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_CHECKS_CONCURRENCY: ${WORKER_CHECKS_CONCURRENCY:-1}
    volumes: [repos:/data/repos:ro]
    read_only: true
    tmpfs: ['/tmp:size=4g', '/home/kicad:size=512m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 1024
    mem_limit: 8g
    cpus: 4
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  web:
    build: { context: .., dockerfile: docker/web.Dockerfile }
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '${HTTP_PORT:-8080}:80'
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - caddy_data:/data     # certificates: losing this means re-issuing them
      - caddy_config:/config
    depends_on: [api]

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redisdata:
  miniodata:
  repos:
