[package]
name = "kicad-core"
version = "0.1.0"
edition = "2021"
description = "KiCad S-expression parser, typed model, semantic diff and BOM for Jumper"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kicad-core"
path = "src/bin/cli.rs"
required-features = ["cli"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]
cli = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
